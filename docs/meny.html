<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Restaurant Eik & Gran - Digital Meny</title>
    <meta name="description" content="Eksklusiv digital mobilmeny åpnet via NFC-bordkort. Sanntidsmeny synkronisert med restaurantens kjøkken." />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            },
            colors: {
              accent: {
                400: '#34d399',
                500: '#10b981',
                600: '#059669',
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      /* Skjul scrollbar for horisontale tabs men behold scrolling */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between selection:bg-zinc-800">

    <!-- Mobil-ramme container (Sentrert på desktop for autentisk native app følelse) -->
    <div class="w-full max-w-md mx-auto min-h-screen flex flex-col bg-zinc-950 border-x border-zinc-900 shadow-2xl relative">
      
      <!-- ========================================== -->
      <!-- MOBIL TOPPLINJE & STATUS                   -->
      <!-- ========================================== -->
      <div class="px-5 pt-3 pb-2 flex items-center justify-between text-[11px] font-semibold text-zinc-500 border-b border-zinc-900 bg-zinc-950/90 backdrop-blur sticky top-0 z-30">
        <span class="flex items-center gap-1.5">
          <span class="h-2 w-2 rounded-full bg-accent-500 animate-pulse"></span>
          <span class="text-zinc-400 font-mono">Bord 14 · Salong</span>
        </span>
        <span class="text-[10px] uppercase tracking-wider text-zinc-600 font-mono">NFC Tilkoblet</span>
      </div>

      <!-- ========================================== -->
      <!-- RESTAURANT BRANDING HEADER                 -->
      <!-- ========================================== -->
      <header class="p-6 text-center border-b border-zinc-900 bg-gradient-to-b from-zinc-900/40 via-zinc-950 to-zinc-950">
        <p class="text-[10px] font-semibold uppercase tracking-widest text-zinc-500">Fine Dining & Vinbar</p>
        <h1 class="text-2xl font-bold tracking-tight text-white mt-1 uppercase">Restaurant Eik & Gran</h1>
        <p class="text-xs text-zinc-400 mt-1 max-w-xs mx-auto">
          Sesongens råvarer og klassiske favoritter. Velkommen til bords.
        </p>

        <!-- Hurtiglenke til admin i prototypen -->
        <div class="mt-4 flex items-center justify-center gap-2">
          <a
            href="admin.html"
            target="_blank"
            rel="noopener noreferrer"
            class="inline-flex items-center gap-1.5 px-3 py-1 text-[11px] font-medium text-zinc-400 hover:text-white bg-zinc-900 hover:bg-zinc-850 rounded-full border border-zinc-800 transition-colors shadow-xs"
            title="Åpne kontrollpanelet for å teste toveis endringer"
          >
            <span>Åpne Kontrollpanel (admin.html)</span>
            <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
            </svg>
          </a>
        </div>
      </header>

      <!-- ========================================== -->
      <!-- KATEGORIFILTER OG SØK                      -->
      <!-- ========================================== -->
      <div class="sticky top-[37px] z-20 bg-zinc-950/95 backdrop-blur-md border-b border-zinc-900 px-4 py-3 space-y-2.5">
        
        <!-- Horisontalt scrollbare kategori-knapper -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5">
          <button
            onclick="setGuestFilter('Alle')"
            id="g-btn-Alle"
            class="guest-cat-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white text-zinc-950 transition-all shrink-0 shadow-xs"
          >
            Alle retter
          </button>
          <button
            onclick="setGuestFilter('Hovedrett')"
            id="g-btn-Hovedrett"
            class="guest-cat-btn px-3.5 py-1.5 rounded-full text-xs font-medium text-zinc-400 hover:text-white bg-zinc-900 border border-zinc-800/80 transition-all shrink-0"
          >
            Hovedretter
          </button>
          <button
            onclick="setGuestFilter('Forrett')"
            id="g-btn-Forrett"
            class="guest-cat-btn px-3.5 py-1.5 rounded-full text-xs font-medium text-zinc-400 hover:text-white bg-zinc-900 border border-zinc-800/80 transition-all shrink-0"
          >
            Forretter
          </button>
          <button
            onclick="setGuestFilter('Desserter')"
            id="g-btn-Desserter"
            class="guest-cat-btn px-3.5 py-1.5 rounded-full text-xs font-medium text-zinc-400 hover:text-white bg-zinc-900 border border-zinc-800/80 transition-all shrink-0"
          >
            Desserter
          </button>
          <button
            onclick="setGuestFilter('Drikke')"
            id="g-btn-Drikke"
            class="guest-cat-btn px-3.5 py-1.5 rounded-full text-xs font-medium text-zinc-400 hover:text-white bg-zinc-900 border border-zinc-800/80 transition-all shrink-0"
          >
            Drikke & Vin
          </button>
        </div>

        <!-- Søkefelt inni mobilmenyen -->
        <div class="relative">
          <input
            type="text"
            id="menu-search-input"
            oninput="handleSearch(event)"
            placeholder="Søk etter rett eller ingrediens..."
            class="w-full bg-zinc-900/80 border border-zinc-800 text-xs text-white rounded-xl py-2 pl-8 pr-3 placeholder:text-zinc-500 focus:outline-none focus:border-zinc-700 focus:bg-zinc-900 transition-colors"
          />
          <svg class="absolute left-2.5 top-2.5 h-3.5 w-3.5 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>

      </div>

      <!-- ========================================== -->
      <!-- MENY ELEMENTER (DYNAMISK GENERERT)         -->
      <!-- ========================================== -->
      <main class="flex-1 p-4 space-y-3.5" id="menu-items-container">
        <!-- Genereres dynamisk via JavaScript fra localStorage -->
      </main>

      <!-- ========================================== -->
      <!-- BUNN: TILKALL SERVITØR & FOOTER            -->
      <!-- ========================================== -->
      <footer class="p-4 border-t border-zinc-900 bg-zinc-950/90 backdrop-blur sticky bottom-0 z-20 space-y-3">
        <button
          onclick="callWaiter()"
          id="call-waiter-btn"
          class="w-full py-3 px-4 rounded-xl bg-white hover:bg-zinc-200 text-zinc-950 font-semibold text-xs tracking-tight transition-all active:scale-98 shadow-md flex items-center justify-center gap-2"
        >
          <svg class="h-4 w-4 text-zinc-950" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <span>Tilkall servitør (Bord 14)</span>
        </button>

        <div class="text-center text-[10px] text-zinc-400 space-y-1">
          <p>SmakSync™ · Drevet av kontaktløs NFC · Ingen app kreves</p>
          <p id="live-sync-indicator" class="text-zinc-400 font-mono">Synkronisert med kjøkkenet</p>
        </div>
      </footer>

    </div>

    <!-- ========================================== -->
    <!-- VANILLA JAVASCRIPT: LOGIKK FOR MENY        -->
    <!-- ========================================== -->
    <script>
      const STORAGE_KEY = 'smartmeny_data';

      // Standardretter hvis localStorage ikke er initialisert ennå
      const DEFAULT_DISHES = [
        {
          id: 'sm-1',
          name: 'Truffle & Dry-Aged Burger',
          desc: '200g kvernet norsk storfe, trøffelmajones, lagret cheddar og smørstekt brioche.',
          price: 225,
          category: 'Hovedrett',
          soldOut: false
        },
        {
          id: 'sm-2',
          name: 'Pannestekt Kveite',
          desc: 'Bresert purreløk, ramsløkolje og champagne beurre blanc.',
          price: 365,
          category: 'Hovedrett',
          soldOut: false
        },
        {
          id: 'sm-3',
          name: 'Dagens Fangst: Villtorsk',
          desc: 'Saltbakt sellerirot, Sandefjordsmør og friterte kapers.',
          price: 315,
          category: 'Hovedrett',
          soldOut: true
        },
        {
          id: 'sm-4',
          name: 'Villkveite Ceviche',
          desc: 'Tindved, sjalottløk, koriander og sprø jordskokkchips.',
          price: 175,
          category: 'Forrett',
          soldOut: false
        },
        {
          id: 'sm-5',
          name: 'Husets Focaccia & Pisket Smør',
          desc: 'Nybakt surdeigsfocaccia med rosmarin og havsalt fra Røros.',
          price: 65,
          category: 'Forrett',
          soldOut: false
        },
        {
          id: 'sm-6',
          name: 'Multer & Røros-is',
          desc: 'Villmulter, karamellisert hvit sjokolade og tindvedsirup.',
          price: 165,
          category: 'Desserter',
          soldOut: false
        },
        {
          id: 'sm-7',
          name: 'Nøgne Ø IPA (0.33l)',
          desc: 'Klassisk håndverks-IPA med rik humleprofil og frisk sitrus.',
          price: 115,
          category: 'Drikke',
          soldOut: false
        },
        {
          id: 'sm-8',
          name: 'Nordic Old Fashioned',
          desc: 'Fatlagret akevitt, rugbourbon, røsslyngsirup og appelsinolje.',
          price: 175,
          category: 'Drikke',
          soldOut: false
        }
      ];

      let activeCategory = 'Alle';
      let searchQuery = '';
      let previousDataString = '';

      /**
       * Henter retter fra localStorage
       */
      function getDishes() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (!stored) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_DISHES));
          return DEFAULT_DISHES;
        }
        try {
          return JSON.parse(stored);
        } catch (e) {
          console.error('Feil ved lesing av meny:', e);
          return DEFAULT_DISHES;
        }
      }

      /**
       * Rendrer meny-kortene dynamisk
       */
      function renderMenu() {
        const dishes = getDishes();
        const container = document.getElementById('menu-items-container');
        if (!container) return;

        // Filtrer basert på kategori og søketekst
        const filtered = dishes.filter(dish => {
          if (activeCategory !== 'Alle' && dish.category !== activeCategory) {
            return false;
          }
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            const matchName = dish.name.toLowerCase().includes(q);
            const matchDesc = (dish.desc || '').toLowerCase().includes(q);
            if (!matchName && !matchDesc) return false;
          }
          return true;
        });

        if (filtered.length === 0) {
          container.innerHTML = `
            <div class="py-16 text-center text-zinc-500 space-y-2">
              <svg class="h-8 w-8 mx-auto text-zinc-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
              </svg>
              <p class="text-xs">Ingen retter funnet i denne visningen.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = filtered.map(dish => {
          const isSoldOut = dish.soldOut === true;

          // Utsolgt styling vs. Aktiv luksuriøs styling
          if (isSoldOut) {
            return `
              <article class="p-4 rounded-2xl bg-zinc-900/40 border border-zinc-800/60 opacity-60 transition-all">
                <div class="flex items-start justify-between gap-3">
                  <div class="space-y-1">
                    <div class="flex items-center gap-2">
                      <span class="inline-block text-[10px] font-semibold text-zinc-500 uppercase tracking-wider">
                        ${dish.category}
                      </span>
                      <span class="inline-block text-[10px] font-semibold px-2 py-0.5 rounded-full bg-zinc-800 text-zinc-400 border border-zinc-700">
                        Utsolgt i kveld
                      </span>
                    </div>
                    <h3 class="text-sm font-semibold text-zinc-400 line-through">
                      ${escapeHtml(dish.name)}
                    </h3>
                  </div>
                  <div class="text-right">
                    <span class="font-mono text-sm text-zinc-500 line-through">
                      ${dish.price},-
                    </span>
                  </div>
                </div>
                ${dish.desc ? `<p class="text-xs text-zinc-500 mt-2 leading-relaxed">${escapeHtml(dish.desc)}</p>` : ''}
              </article>
            `;
          }

          // Aktiv tilgjengelig rett
          return `
            <article class="p-4 rounded-2xl bg-zinc-900/80 border border-zinc-850 hover:border-zinc-700 transition-all shadow-xs group">
              <div class="flex items-start justify-between gap-3">
                <div class="space-y-1 flex-1">
                  <span class="inline-block text-[10px] font-semibold text-zinc-500 uppercase tracking-wider">
                    ${dish.category}
                  </span>
                  <h3 class="text-base font-semibold text-white tracking-tight group-hover:text-accent-400 transition-colors">
                    ${escapeHtml(dish.name)}
                  </h3>
                </div>
                <div class="text-right shrink-0">
                  <span class="font-mono text-base font-bold text-white tracking-tight">
                    ${dish.price},-
                  </span>
                </div>
              </div>
              ${dish.desc ? `<p class="text-xs text-zinc-400 mt-2 leading-relaxed">${escapeHtml(dish.desc)}</p>` : ''}
            </article>
          `;
        }).join('');

        // Oppdater tidsstempel
        const ind = document.getElementById('live-sync-indicator');
        if (ind) {
          const now = new Date();
          const t = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
          ind.innerText = `Sist oppdatert: kl. ${t}`;
        }
      }

      /**
       * Filterkategori endring
       */
      function setGuestFilter(cat) {
        activeCategory = cat;
        ['Alle', 'Hovedrett', 'Forrett', 'Desserter', 'Drikke'].forEach(c => {
          const btn = document.getElementById(`g-btn-${c}`);
          if (btn) {
            if (c === cat) {
              btn.className = 'guest-cat-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white text-zinc-950 transition-all shrink-0 shadow-xs';
            } else {
              btn.className = 'guest-cat-btn px-3.5 py-1.5 rounded-full text-xs font-medium text-zinc-400 hover:text-white bg-zinc-900 border border-zinc-800/80 transition-all shrink-0';
            }
          }
        });
        renderMenu();
      }

      function handleSearch(e) {
        searchQuery = e.target.value.trim();
        renderMenu();
      }

      function callWaiter() {
        const btn = document.getElementById('call-waiter-btn');
        btn.innerHTML = `
          <svg class="h-4 w-4 text-accent-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span class="text-accent-400">Servitør er varslet!</span>
        `;
        btn.classList.add('border', 'border-accent-400');
        setTimeout(() => {
          btn.innerHTML = `
            <svg class="h-4 w-4 text-zinc-950" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
            <span>Tilkall servitør (Bord 14)</span>
          `;
          btn.classList.remove('border', 'border-accent-400');
        }, 3000);
      }

      function escapeHtml(string) {
        if (!string) return '';
        const div = document.createElement('div');
        div.innerText = string;
        return div.innerHTML;
      }

      /**
       * 1. Lytt til window 'storage'-event fra andre faner (f.eks. admin.html)
       */
      window.addEventListener('storage', (event) => {
        if (event.key === STORAGE_KEY) {
          renderMenu();
        }
      });

      /**
       * 2. Rask periodisk kontroll (hvert 600ms) som garanterer umiddelbar
       * oppdatering selv om browseren kjører i iframe eller split-view
       */
      setInterval(() => {
        const currentData = localStorage.getItem(STORAGE_KEY) || '';
        if (currentData !== previousDataString) {
          previousDataString = currentData;
          renderMenu();
        }
      }, 600);

      // Start ved lasting
      document.addEventListener('DOMContentLoaded', () => {
        previousDataString = localStorage.getItem(STORAGE_KEY) || '';
        renderMenu();
      });
      renderMenu();
    </script>
  </body>
</html>
